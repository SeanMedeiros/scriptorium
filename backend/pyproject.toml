[project]
name = "scriptorium"
version = "0.1.0"
description = "SCRIPTORIUM — Historical Document Intelligence Platform"
requires-python = ">=3.12,<3.14"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "boto3>=1.34",
  "httpx>=0.27",
  "pillow>=10",
  "numpy>=1.26",
  "pypdfium2>=4.30",
  "pyyaml>=6",
  "jsonschema>=4.20",
  "htrmopo>=0.6",
  "lxml>=5",
  "rapidfuzz>=3.9",
  "python-docx>=1.1",
  "fpdf2>=2.8",
  "uharfbuzz>=0.40",
  "threadpoolctl>=3",
]

[project.optional-dependencies]
# Recognition worker only — the API image does not need PyTorch.
worker = ["kraken==7.1.1", "scipy>=1.11"]
test = ["pytest>=8", "pytest-cov>=5", "moto[s3]>=5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires PostgreSQL and Redis",
  "fixture_only: isolated unit test using labelled fixtures, NOT a real HTR integration test",
  "kraken: requires a working Kraken installation",
  "zenodo: requires network access to zenodo.org (real downloads)",
]
